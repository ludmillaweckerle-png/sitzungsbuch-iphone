<!doctype html><html><head><meta charset=utf8><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sitzungsbuch"><meta name="theme-color" content="#55388A"><link rel="manifest" href="manifest.webmanifest"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sitzungsbuch</title>

<style>
/* Layout: one narrow column like a pocket notebook. Client list first, then one client file
   with five fixed tabs at thumb height. Forms take the whole screen so the keyboard never covers them. */
:root {
  --bg: #F5F4F8;
  --surface: #FFFFFF;
  --sunken: #E9E6F0;
  --ink: #1B1823;
  --ink-2: #5C5868;
  --line: #D9D5E2;
  --accent: #55388A;
  --accent-ink: #FFFFFF;
  --mark: #E3B21C;
  --warn: #9A4A08;
  --warn-bg: #FBEBD9;
  --ok: #2A6A4B;
  --ok-bg: #DFF0E6;
  --danger: #A12A2A;
  --danger-bg: #F9E1E1;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15131A; --surface: #1F1C26; --sunken: #2B2734; --ink: #EDEAF3; --ink-2: #A9A4B6;
    --line: #38333F; --accent: #B9A0EC; --accent-ink: #1B1823; --mark: #E6BE42;
    --warn: #F0AA66; --warn-bg: #3A2A17; --ok: #80CCA5; --ok-bg: #1B3327;
    --danger: #F09090; --danger-bg: #3D1F1F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15131A; --surface: #1F1C26; --sunken: #2B2734; --ink: #EDEAF3; --ink-2: #A9A4B6;
  --line: #38333F; --accent: #B9A0EC; --accent-ink: #1B1823; --mark: #E6BE42;
  --warn: #F0AA66; --warn-bg: #3A2A17; --ok: #80CCA5; --ok-bg: #1B3327;
  --danger: #F09090; --danger-bg: #3D1F1F; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p, ul, dl, dd, fieldset { margin: 0; padding: 0; }
ul { list-style: none; }
fieldset { border: 0; min-width: 0; }

.wrap { max-width: 35rem; margin-inline: auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 20px; }
.wrap.has-tabs { padding-bottom: 104px; }

h1 { font: 700 2rem/1.1 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
h2 { font: 700 1.35rem/1.2 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
h3 { font: 700 0.8rem/1.3 var(--font-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: 0.875rem; }
.num { font-variant-numeric: tabular-nums; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head > div { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }

/* buttons */
.btn { min-height: 46px; padding: 10px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.block { width: 100%; }
.btn.danger { color: var(--danger); }
.btn.danger[data-armed] { background: var(--danger-bg); border-color: var(--danger); font-weight: 700; }
.link { background: none; border: 0; padding: 10px 0; min-height: 44px; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* notices */
.note { border-left: 4px solid var(--mark); background: var(--surface); padding: 12px 14px; border-radius: 0 var(--r) var(--r) 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.note.warn { border-left-color: var(--warn); }
.note .link { padding-block: 4px; min-height: 36px; }

.pill { display: inline-block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 99px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.danger { background: var(--danger-bg); color: var(--danger); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }

/* meter */
.meter { height: 8px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--mark); border-radius: 4px; }
.meter.warn i { background: var(--warn); }
.meter.danger i { background: var(--danger); }
.meter.big { height: 14px; border-radius: 7px; }

/* client list */
.clients { display: flex; flex-direction: column; gap: 10px; }
.client { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.client-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.client-name { font: 700 1.2rem/1.2 var(--font-display); min-width: 0; overflow-wrap: anywhere; }
.client-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.client-remind { font-size: 0.875rem; font-weight: 700; color: var(--warn); overflow-wrap: anywhere; }

/* archive: a file on the overview is dragged to the right */
.swipe { position: relative; border-radius: var(--r); }
.swipe.drag { overflow: hidden; }
.swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; padding-inline: 16px; border-radius: var(--r); background: var(--sunken); color: var(--ink-2); font-weight: 700; visibility: hidden; }
.swipe.drag .swipe-bg { visibility: visible; }
.swipe.go .swipe-bg { background: var(--accent); color: var(--accent-ink); }
.swipe-bg .sw-del { display: none; }
.swipe.left .swipe-bg { justify-content: flex-end; }
.swipe.left .swipe-bg .sw-arch { display: none; }
.swipe.left .swipe-bg .sw-del { display: inline; }
.swipe.left.go .swipe-bg { background: var(--danger); color: var(--bg); }
.trash-acts { display: flex; gap: 20px; flex-wrap: wrap; }
.link.danger { color: var(--danger); }
.swipe .client { position: relative; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.swipe .client.back { transition: transform 0.18s ease-out; }
@media (prefers-reduced-motion: reduce) { .swipe .client.back { transition: none; } }
.arch { display: flex; flex-direction: column; align-items: flex-start; }

/* client header */
.chead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: -16px; padding: 4px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; }
.chead-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* rows */
.rows { border-top: 1px solid var(--line); }
.rows > li { border-bottom: 1px solid var(--line); }
.row { width: 100%; text-align: left; background: none; border: 0; padding: 14px 0; display: flex; flex-direction: column; gap: 4px; }
.row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.row-top b { font-weight: 700; }
.row-title { font-weight: 500; overflow-wrap: anywhere; }
.row-text { color: var(--ink-2); overflow-wrap: anywhere; white-space: pre-line; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.row-agree { overflow-wrap: anywhere; font-size: 0.9375rem; }

.check { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; }
.check input { width: 26px; height: 26px; margin: 4px 0 0; flex: none; accent-color: var(--accent); }
.check label { flex: 1; min-width: 0; padding-block: 5px; overflow-wrap: anywhere; }
.check label small { display: block; color: var(--ink-2); font-size: 0.875rem; }
.check label small.late { color: var(--warn); font-weight: 700; }
.check.done label { color: var(--ink-2); text-decoration: line-through; }
.check .link { padding: 5px 0; min-height: 36px; font-weight: 500; font-size: 0.875rem; }

.empty { padding: 20px 0; color: var(--ink-2); }

/* quota */
.quota { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.quota-big { font: 700 3rem/1 var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.quota-big small { font: 500 1rem/1 var(--font-body); letter-spacing: 0; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.facts dt { font-size: 0.8rem; color: var(--ink-2); }
.facts dd { font-weight: 700; font-variant-numeric: tabular-nums; }
.pairs > li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; }
.pairs input[type="checkbox"] { width: 26px; height: 26px; margin: 0; flex: none; accent-color: var(--accent); }
.pairs label { flex: 1; min-width: 0; padding-block: 5px; }
.pairs .eur, .pairs .std { text-align: right; white-space: nowrap; }
.pairs .eur { min-width: 5rem; }
.pairs .std { min-width: 4.25rem; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 35rem; margin-inline: auto; display: flex; }
.tab { flex: 1 1 0; min-width: 0; background: none; border: 0; border-top: 3px solid transparent; padding: 12px 2px 14px; font-size: 0.9rem; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.tab[aria-current="true"] { color: var(--ink); font-weight: 700; border-top-color: var(--mark); }
.tab sup { font-size: 0.7rem; margin-left: 2px; color: var(--accent); font-weight: 700; }

/* forms */
.fhead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: -16px; padding: 6px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fhead strong { font: 700 1.05rem/1.2 var(--font-display); text-align: center; min-width: 0; }
.fhead .btn { min-height: 40px; padding: 6px 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, legend { font-weight: 700; font-size: 0.9375rem; padding: 0; }
.field .hint { font-size: 0.875rem; color: var(--ink-2); }
input[type="text"], input[type="date"], input[type="number"], input[type="password"], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
input[type="file"] { width: 100%; max-width: 100%; }
textarea { min-height: 7.5rem; resize: vertical; line-height: 1.45; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.inline-check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.inline-check input { width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
#bk-out { min-height: 9rem; font-size: 0.8rem; font-family: ui-monospace, Menlo, Consolas, monospace; }
#bk-msg:empty { display: none; }
#bk-msg { font-weight: 700; }
#lock-msg:empty { display: none; }
#lock-msg { font-weight: 700; color: var(--danger); }
.lockwrap { padding-top: 18vh; }

.toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; margin-inline: auto; max-width: 22rem; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r); text-align: center; font-weight: 500; }
</style>

<style>
/* Ergänzungen aus dem Aktenschrank: abgerechnete Sitzungen und Rechnungsvorschau */
.sbapp .pairs .re-mark { display: block; font-size: 0.8rem; color: var(--ok); }
.sbapp .pairs > li.billed { background: var(--ok-bg); border-left: 4px solid var(--ok); padding-inline: 10px 12px; border-radius: 0 var(--r) var(--r) 0; }
.sbapp .pairs > li.billed + li.billed { margin-top: 2px; }
.sbapp .re-wrap { overflow-x: auto; }
.sbapp .re-prev { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.sbapp .re-prev th, .sbapp .re-prev td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
.sbapp .re-prev thead th { font-size: 0.8rem; color: var(--ink-2); font-weight: 600; }
.sbapp .re-prev .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sbapp .re-prev tfoot th { text-align: right; }
.sbapp .re-prev tfoot th, .sbapp .re-prev tfoot td { border-bottom: 0; }
.sbapp .btn[disabled] { opacity: .5; cursor: default; }
</style>

<script>
/* Sitzungsbuch für Handy und Tablet.
   Dies ist derselbe Baustein wie im Aktenschrank (Taschen-Ansicht).
   Jeder Eintrag trägt einen Zeitstempel; beim Einlesen einer Sicherung
   wird zusammengeführt, je Eintrag gilt der jüngere Stand. Die Einträge
   bleiben wie bisher unter "sitzungsbuch.v1" im Browser gespeichert. */
/* ---------- Sitzungsbuch ---------- */
(function () {
  'use strict';

  var KEY = 'sitzungsbuch.v1';
  var FASSUNG = '13. Oktober 2026, 20:40 Uhr';   // sichtbar auf dem Sperrbildschirm und in den Einstellungen
  var storageOk = true;
  var root = null, app = null, lockEl = null, toastEl = null;   // werden beim Einhängen gesetzt
  var toastTimer = null;
  var dlPromise = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('downloads').catch(function () { return null; })
    : Promise.resolve(null);

  /* ------------------------------------------------------------------
     Zwei Betriebsarten
     'tasche'  Handy und Tablet: kein Zugriff auf Ordner. Alle Akten
               liegen im Speicher des Browsers, wie im bisherigen
               Sitzungsbuch. Abgleich über die Sicherungsdatei.
     'ordner'  Computer: der Aktenschrank verwaltet die Akten als
               Ordner. Hier arbeitet das Sitzungsbuch mit genau einer
               Akte, und die liegt als Datei in ihrem Ordner.
     ------------------------------------------------------------------ */
  var MODE = 'tasche';
  var inFolder = function () { return MODE === 'ordner'; };
  var folderIO = null;   // vom Aktenschrank gesetzt: { read, write, name }

  /* Jede Änderung bekommt einen Zeitstempel. Beim Abgleich zweier
     Geräte gewinnt damit je Eintrag der jüngere Stand. */
  function stamp(x) { if (x && typeof x === 'object') x.mod = new Date().toISOString(); return x; }

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function z(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  function today() { return iso(new Date()); }
  function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return iso(d); }
  function toDate(s) { var p = String(s).split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); }
  function fDate(s, opts) {
    if (!s) return '';
    try { return new Intl.DateTimeFormat('de-DE', opts || { day: 'numeric', month: 'short', year: 'numeric' }).format(toDate(s)); }
    catch (e) { return String(s); }
  }
  function fDay(s) { return fDate(s, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' }); }
  var nf = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 });
  var cf = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
  /* Euro amount noted in the free-text "Ort" field. With several amounts the last one counts. */
  function euroIn(text) {
    var re = /€\s*(\d[\d.]*(?:,\d{1,2})?)|(\d[\d.]*(?:,\d{1,2})?)\s*(?:€|euro\b|eur\b)/gi, m, t = null;
    while ((m = re.exec(String(text || '')))) t = m[1] || m[2];
    if (t == null) return null;
    t = t.replace(/\.+$/, '');
    if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    var n = Number(t);
    return isFinite(n) ? n : null;
  }
  function daysBetween(a, b) { return Math.round((toDate(b) - toDate(a)) / 86400000); }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2600);
  }

  /* ---------- state ---------- */
  function exampleClient() {
    var y = new Date().getFullYear();
    return {
      id: uid(), example: true, name: 'M. K.', note: 'Beispielakte zum Ausprobieren. Coaching im Rahmen der Eingliederungshilfe.',
      quota: { hours: 40, unit: 60, from: y + '-01-01', to: y + '-12-31' },
      sessions: [
        { id: uid(), date: addDays(-30), min: 90, form: 'Präsenz', counts: true, ort: 'Hausbesuch, 18 km', topics: 'Erstgespräch, Anliegen klären', notes: 'Anliegen: Erschöpfung nach Arbeitstagen, wenig Erholung am Wochenende.\nBisherige Strategien gesammelt.', agree: 'Eine Woche lang Belastung am Abend notieren.' },
        { id: uid(), date: addDays(-16), min: 60, form: 'Video', counts: true, topics: 'Stress-Signale erkennen', notes: 'Frühe Signale benannt: Geräuschempfindlichkeit, Rückzug, Kopfdruck.\nUnterschied zwischen Anspannung und Erschöpfung besprochen.', agree: 'Signalliste ergänzen. Kopfhörer im Großraumbüro ausprobieren.' },
        { id: uid(), date: addDays(-2), min: 60, form: 'Video', counts: true, topics: 'Pausen im Arbeitsalltag', notes: 'Kopfhörer helfen deutlich. Pausen werden noch oft ausgelassen.\nGespräch mit der Teamleitung steht an.', agree: 'Zwei feste Pausen pro Arbeitstag einplanen.' }
      ],
      moods: [],
      tasks: [],
      topics: [
        { id: uid(), text: 'Gespräch mit der Teamleitung nachbesprechen', done: false, created: addDays(-2) },
        { id: uid(), text: 'Erholung am Wochenende', done: false, created: addDays(-2) }
      ]
    };
  }
  function normalize(data) {
    var s = (data && typeof data === 'object') ? data : {};
    if (!Array.isArray(s.clients)) s.clients = [];
    s.clients = s.clients.filter(function (c) { return c && typeof c === 'object'; });
    s.clients.forEach(function (c) {
      if (!c.id) c.id = uid();
      c.name = String(c.name || 'Ohne Namen');
      c.note = String(c.note || '');
      var q = (c.quota && typeof c.quota === 'object') ? c.quota : {};
      /* mod ist der Zeitstempel der letzten Änderung. Er muss erhalten
         bleiben, sonst kann der Abgleich die Stände nicht vergleichen. */
      c.quota = { hours: +q.hours || 0, unit: +q.unit || 60, from: q.from || '', to: q.to || '', mod: q.mod || '' };
      if (c.mod != null) c.mod = String(c.mod);
      c.deleted = Array.isArray(c.deleted)
        ? c.deleted.filter(function (x) { return x && x.id; }).map(function (x) { return { id: String(x.id), at: String(x.at || '') }; })
        : [];
      ['sessions', 'moods', 'tasks', 'topics'].forEach(function (k) {
        c[k] = Array.isArray(c[k]) ? c[k].filter(function (x) { return x && typeof x === 'object'; }) : [];
        c[k].forEach(function (x) { if (!x.id) x.id = uid(); if (x.mod != null) x.mod = String(x.mod); });
      });
    });
    /* Am Handy gelöschte Akten: Der Vermerk verhindert, dass der Abgleich
       sie wieder auf das Gerät holt. */
    s.deletedClients = Array.isArray(s.deletedClients)
      ? s.deletedClients.filter(function (x) { return x && x.id; }).map(function (x) { return { id: String(x.id), at: String(x.at || '') }; })
      : [];
    s.trash = Array.isArray(s.trash)
      ? s.trash.filter(function (t) { return t && t.c && typeof t.c === 'object'; })
        .map(function (t) { return { at: String(t.at || ''), c: normalize({ clients: [t.c] }).clients[0] }; })
      : [];
    s.lastBackup = s.lastBackup || '';
    return s;
  }

  /* ------------------------------------------------------------------
     Zwei Stände einer Akte zusammenführen
     Beide Geräte dürfen eintragen. Je Eintrag gewinnt der jüngere
     Zeitstempel; was nur auf einer Seite steht, kommt dazu. Nichts
     wird stillschweigend überschrieben. Absichtlich gelöschte Einträge
     bleiben gelöscht, solange der Löschvermerk jünger ist als die
     letzte Änderung am Eintrag.
     ------------------------------------------------------------------ */
  function newer(a, b) { return String(a || '') > String(b || ''); }
  function mergeList(a, b, gone) {
    var seen = {}, order = [], pick = {};
    function take(x) {
      if (!seen[x.id]) { seen[x.id] = 1; order.push(x.id); pick[x.id] = x; return; }

    });

    var q = newer((b.quota || {}).mod, (a.quota || {}).mod) ? b.quota : a.quota;

      id: a.id || b.id, name: lead.name, note: lead.note, mod: lead.mod || '',

      moods: mergeList(a.moods, b.moods, gone), tasks: mergeList(a.tasks, b.tasks, gone),

  /* Was hat das Zusammenführen gebracht? Für die Rückmeldung an Vera. */

    var n = 0;
    ['sessions', 'topics', 'moods', 'tasks'].forEach(function (k) {
      var had = {}; ((before && before[k]) || []).forEach(function (x) { had[x.id] = x.mod || ''; });
      (after[k] || []).forEach(function (x) { if (!(x.id in had) || newer(x.mod, had[x.id])) n += 1; });

  }
  function load() {
    var raw = null;
    try {
      localStorage.setItem(KEY + '.test', '1'); localStorage.removeItem(KEY + '.test');
      raw = localStorage.getItem(KEY);
    } catch (e) { storageOk = false; }
    if (raw) {
      try {
        var o = JSON.parse(raw);
        if (o && o.locked) { lockMeta = { salt: o.salt, iter: +o.iter || 310000 }; return null; }
        return normalize(o);

  }
  /* With a code set, entries are stored encrypted (AES-GCM, key derived from the code). */
  var cryptoKey = null, lockMeta = null, saveChain = Promise.resolve();
  /* true, solange die Einträge noch verschlüsselt im Speicher liegen und S
     nur ein leerer Platzhalter ist. Dann darf nichts gespeichert werden. */
  var pendingLoad = false;
  function save() {
    /* Am Computer: die eine offene Akte in ihre Datei im Ordner der Akte.
       Das Schreiben selbst erledigt der Aktenschrank, der auch die PDFs
       der Akte nachzieht. */
    if (inFolder()) {
      var c = S.clients[0];
      if (!c || !folderIO) return;
      try { folderIO.write(c); storageOk = true; }
      catch (e) { storageOk = false; }
      return;
    }
    if (pendingLoad) return;
    if (!cryptoKey) {
      try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
      catch (e) { storageOk = false; }
      return;
    }

    saveChain = saveChain.then(function () {
      var iv = crypto.getRandomValues(new Uint8Array(12));
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(json)).then(function (ct) {
        localStorage.setItem(KEY, JSON.stringify({ locked: 1, v: 1, salt: meta.salt, iter: meta.iter, iv: b64(iv), data: b64(new Uint8Array(ct)) }));

  /* S wird beim Einhängen gefüllt: in der Taschen-Ansicht aus dem

  function quotaStats(c) {
    var q = c.quota, unit = q.unit || 60, t = today();

    var usedMin = counted.reduce(function (a, s) { return a + (+s.min || 0); }, 0);

    var st = { total: total, used: used, left: left, unit: unit, counted: counted, pct: total ? Math.max(0, Math.min(1, used / total)) : 0, level: '', label: '' };
    if (!total) return st;
    if (left < 0) { st.level = 'danger'; st.label = 'überzogen'; }
    else if (left === 0) { st.level = 'danger'; st.label = 'aufgebraucht'; }
    else if (q.to && q.to < t) { st.level = 'danger'; st.label = 'Zeitraum abgelaufen'; }
    else if (left <= Math.max(2, total * 0.1)) { st.level = 'warn'; st.label = 'fast aufgebraucht'; }
    else if (q.to && daysBetween(t, q.to) <= 30) { st.level = 'warn'; st.label = 'endet am ' + fDate(q.to, { day: 'numeric', month: 'short' }); }

  function folgeText(fo) {

    return 'Der bewilligte Zeitraum endet am ' + fDate(fo.to) + ' (' + rel + ').';
  }

  function submitForm(formEl) {

        it = S.clients[0];
        if (it) { it.note = v('note'); stamp(it); }

        return;
      }
      if (!v('name')) return;
      it = f.id ? S.clients.find(function (x) { return x.id === f.id; }) : null;
      if (it) { it.name = v('name'); it.note = v('note'); stamp(it); }
      else {
        it = stamp({ id: uid(), name: v('name'), note: v('note'), quota: { hours: 0, unit: 60, from: '', to: '' }, sessions: [], moods: [], tasks: [], topics: [] });

      }
    } else if (f.type === 'quota') {

    } else if (f.type === 'session') {

      it = findItem(c, 'session', f.id);
      if (it) stamp(Object.assign(it, data)); else { data.id = uid(); c.sessions.push(stamp(data)); }
      d.getAll('discussed').forEach(function (id) { var t = findItem(c, 'topic', id); if (t) { t.done = true; t.doneAt = data.date; stamp(t); } });
    } else if (f.type === 'invoice') {

  function submitInvoice(formEl, c, kopf) {
    var pick = invoicePick(c), btn = formEl.querySelector('button[type="submit"]'), msg = document.getElementById('f-re-msg');

    if (!kopf.nr) return;

    Promise.resolve().then(function () { return folderIO.rechnung(c, pick, kopf); }).then(function (res) {
      pick.forEach(function (s) { s.rechnung = { nr: kopf.nr, datum: kopf.datum }; s.tick = false; stamp(s); });

  /* ---------- backup ---------- */
  function b64(bytes) { var s = ''; for (var i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s); }
  function unb64(str) { var bin = atob(str), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  var ITER = 310000;
  function deriveKey(pass, salt, iter) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  function buildBackup(clients) {
    var daten = clients ? { clients: clients, lastBackup: new Date().toISOString() } : S;
    return JSON.stringify({ format: 'sitzungsbuch-sicherung', version: 1, erstellt: new Date().toISOString(), verschluesselt: false, daten: daten });
  }
  /* Jüngste Änderung irgendwo in einer Akte */
  function lastChange(c) {
    var m = String(c.mod || '');
    if (c.quota && newer(c.quota.mod, m)) m = c.quota.mod;
    ['sessions', 'topics', 'moods', 'tasks'].forEach(function (k) {
      (c[k] || []).forEach(function (x) { if (newer(x.mod, m)) m = x.mod; });
    });
    return m;
  }
  /* Eingelesene Akten in den eigenen Stand einarbeiten, je Eintrag der
     jüngere Stand. Nichts wird ersetzt, nichts gelöscht. */
  function mergeInto(incoming) {
    var mine = {}, order = [], added = 0, changed = 0, skipped = 0, gone = {};
    var bin = {};
    (S.deletedClients || []).forEach(function (x) { gone[x.id] = x.at; });
    (S.trash || []).forEach(function (x) { bin[x.c.id] = x; });
    S.clients.forEach(function (c) { mine[c.id] = c; order.push(c.id); });

      '<button type="button" class="btn danger block" data-act="forgot-wipe">Alle Einträge auf diesem Gerät löschen</button></div></form>';
    window.scrollTo(0, 0);
    var input = document.getElementById('lock-pin'); if (input) input.focus();
  }
  function hideLock() { isLocked = false; lockEl.hidden = true; lockEl.innerHTML = ''; app.hidden = false; }
  async function doUnlock() {
    var input = document.getElementById('lock-pin'), msg = document.getElementById('lock-msg'), btn = document.getElementById('lock-go');
    var pin = input ? input.value : '';
    if (!pin) return;
    btn.disabled = true; btn.textContent = 'Wird geöffnet …'; msg.textContent = '';
    try {
      var r = await openWith(pin);
      cryptoKey = r.key; lockMeta = r.meta;
      /* Beim Öffnen der Seite: den entschlüsselten Stand laden und zeigen.
         Nach einer Sperre im laufenden Betrieb ist S schon aktuell. */
      if (pendingLoad || !S) { S = normalize(r.data); pendingLoad = false; }
      hideLock(); go();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Öffnen'; msg.textContent = 'Der Zahlencode stimmt nicht.';
      input.value = ''; input.focus();
    }
  }
  function pinVal(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  async function setPin() {
    var a = pinVal('pin-new'), b = pinVal('pin-new2');
    if (!/^[0-9]{4,12}$/.test(a)) { bkMsg('Der Zahlencode braucht 4 bis 12 Ziffern.'); return; }
    if (a !== b) { bkMsg('Die beiden Eingaben stimmen nicht überein.'); return; }
    if (cryptoKey) { try { await openWith(pinVal('pin-cur')); } catch (e) { bkMsg('Der aktuelle Zahlencode stimmt nicht.'); return; } }
    try {
      var salt = crypto.getRandomValues(new Uint8Array(16));
      var key = await deriveKey(a, salt, ITER);
      cryptoKey = key; lockMeta = { salt: b64(salt), iter: ITER };
      save(); await saveChain;
    } catch (e) { bkMsg('Der Zahlencode ließ sich nicht einrichten.'); return; }
    render(); bkMsg(storageOk ? 'Zahlencode festgelegt. Er wird ab jetzt bei jedem Öffnen abgefragt.' : 'Speichern auf diesem Gerät ist gerade nicht möglich.');
  }
  async function removePin(el) {
    try { await openWith(pinVal('pin-cur')); } catch (e) { bkMsg('Der aktuelle Zahlencode stimmt nicht.'); return; }
    if (!armed(el, 'Zahlencode wirklich entfernen')) return;
    await saveChain; cryptoKey = null; lockMeta = null; save();
    render(); bkMsg('Zahlencode entfernt. Die Einträge sind wieder unverschlüsselt gespeichert.');
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) hiddenAt = Date.now();
    else if (cryptoKey && !isLocked && hiddenAt && Date.now() - hiddenAt > 5 * 60000) showLock();
  });

  /* ---------- rendering and events ---------- */
  function render() {
    if (!app) return;
    /* Am Computer gibt es nur die eine offene Akte. Aktenliste, Archiv
       und Einstellungen sind Sache des Aktenschranks. */
    if (inFolder() && ui.view !== 'client') ui.view = 'client';
    try {
      app.innerHTML = ui.form ? viewForm() : ui.view === 'client' ? viewClient() : ui.view === 'backup' ? viewBackup() : ui.view === 'archive' ? viewArchive() : ui.view === 'trash' ? viewTrash() : viewHome();
    } catch (e) {
      /* Nie eine leere Seite: Fehler zeigen und die Sicherung trotzdem anbieten. */
      ui.form = null;
      app.innerHTML = '<div class="wrap"><h1>Sitzungsbuch</h1><div class="note warn"><strong>Die Ansicht ließ sich nicht aufbauen.</strong>' +
        '<span class="small">Die Einträge sind nicht verloren. Bitte diese Meldung an Claude weitergeben:</span>' +
        '<span class="small" style="font-family:ui-monospace,monospace;overflow-wrap:anywhere">' + esc((e && (e.message || e)) || 'unbekannt') + ' · Fassung vom ' + FASSUNG + '</span></div>' +
        '<p id="bk-msg" role="status"></p><button class="btn primary block" data-act="export">Sicherung als PDF speichern</button>' +
        '<div class="field" id="bk-outwrap" hidden><label for="bk-out">Inhalt der Sicherung</label><textarea id="bk-out" readonly></textarea>' +
        '<span class="hint">Diesen Inhalt kopieren und aufbewahren. Er lässt sich später unter „Sicherung einlesen“ einfügen.</span>' +
        '<button class="btn" data-act="copy">Inhalt kopieren</button></div>' +
        '<button class="btn block" data-act="go" data-view="home">Erneut versuchen</button></div>';
    }
  }
  function go() { render(); if (!inFolder()) window.scrollTo(0, 0); }
  function openForm(type, id) { ui.scrollY = window.scrollY; ui.form = { type: type, id: id || null }; go(); }
  function closeForm() { ui.form = null; render(); window.scrollTo(0, ui.scrollY || 0); }
  function armed(el, text) {
    if (el.dataset.armed) return true;
    el.dataset.armed = '1'; el.textContent = text; return false;
  }

  function archiveClient(id) {
    var c = S.clients.find(function (x) { return x.id === id; });
    if (!c || c.archived) return;
    var fromForm = !!ui.form;
    c.archived = true; c.archivedAt = today(); stamp(c); save();
    ui.form = null; ui.view = 'home'; ui.clientId = null; ui.undo = id;
    if (fromForm) go(); else render();
  }

  /* Akte in den Papierkorb legen. Sie bleibt dort vollständig erhalten. */
  function deleteClient(id) {
    var i = S.clients.findIndex(function (x) { return x.id === id; });
    if (i < 0) return;
    var c = S.clients[i], fromForm = !!ui.form;
    S.clients.splice(i, 1);
    S.trash = (S.trash || []).filter(function (t) { return t.c.id !== id; });
    S.trash.push({ at: new Date().toISOString(), c: c });
    save();
    ui.form = null; ui.view = 'home'; ui.clientId = null; ui.undo = null; ui.undoDel = { id: id, i: i, name: c.name }; ui.scrollY = 0;
    if (fromForm) go(); else render();
  }
  /* Aus dem Papierkorb zurück in die Übersicht, möglichst an die alte Stelle */
  function restoreClient(id, at) {
    var t = (S.trash || []).find(function (x) { return x.c.id === id; });
    if (!t) return false;
    S.trash = S.trash.filter(function (x) { return x !== t; });
    if (!S.clients.some(function (x) { return x.id === id; })) {
      if (at != null) S.clients.splice(Math.min(at, S.clients.length), 0, t.c); else S.clients.push(t.c);
    }
    S.deletedClients = (S.deletedClients || []).filter(function (x) { return x.id !== id; });
    save();
    return true;
  }
  /* Endgültig löschen: Der Vermerk hält die Akte beim Abgleich fern. */
  function purgeClient(id) {
    var t = (S.trash || []).find(function (x) { return x.c.id === id; });
    if (!t) return;
    S.trash = S.trash.filter(function (x) { return x !== t; });
    if (!t.c.example) {
      S.deletedClients = (S.deletedClients || []).filter(function (x) { return x.id !== id; });
      S.deletedClients.push({ id: id, at: new Date().toISOString() });
    }
  }

  var actions = {
    archive: function (d) { archiveClient(d.id); },
    undelete: function () {
      var u = ui.undoDel; if (!u) return;
      ui.undoDel = null;
      restoreClient(u.id, u.i); render(); toast('Akte wiederhergestellt');
    },
    'trash-restore': function (d) {
      if (restoreClient(d.id)) { render(); toast('Akte wiederhergestellt'); }
    },
    'trash-purge': function (d, el) {
      if (!armed(el, 'Wirklich endgültig löschen')) return;
      purgeClient(d.id); save(); render(); toast('Endgültig gelöscht');
    },
    'trash-empty': function (d, el) {
      if (!armed(el, 'Wirklich alle endgültig löschen')) return;
      (S.trash || []).slice().forEach(function (t) { purgeClient(t.c.id); });
      save(); render(); toast('Papierkorb geleert');
    },
    unarchive: function (d) {
      var c = S.clients.find(function (x) { return x.id === d.id; });
      if (!c) return;
      delete c.archived; delete c.archivedAt; ui.undo = null; stamp(c); save();
      if (ui.form) closeForm(); else render();
      toast('Akte wiederhergestellt');
    },
    go: function (d) { ui.view = d.view; go(); },
    open: function (d) { ui.view = 'client'; ui.clientId = d.id; ui.tab = 'sessions'; go(); },
    tab: function (d) { ui.tab = d.tab; go(); },
    'new': function (d) { openForm(d.type, null); },
    edit: function (d) { openForm(d.type, d.id); },
    cancel: function () { closeForm(); },
    'show-done': function (d) { ui.showDone[d.type] = !ui.showDone[d.type]; render(); },
    toggle: function (d) {
      var c = client(), it = findItem(c, d.type, d.id); if (!it) return;
      it.done = !it.done;
      if (d.type === 'topic') it.doneAt = it.done ? today() : '';
      stamp(it); save(); render();
    },
    'folge-done': function () {
      var c = client(); if (!c || !c.quota.to) return;
      c.followUp = { to: c.quota.to, at: today() };
      stamp(c); save(); render(); toast('Folgeantrag als gestellt vermerkt');
    },
    'folge-undo': function () {
      var c = client(); if (!c) return;
      delete c.followUp;
      stamp(c); save(); render();
    },
    invoice: function () {
      if (!canInvoice()) return;
      openForm('invoice', null);
      Promise.resolve().then(function () { return folderIO.rechnungNummer(); }).then(function (nr) {
        var el = document.getElementById('f-nr');
        if (el && !el.value && nr) el.value = nr;
      }, function () { /* dann von Hand */ });
    },
    'invoice-open': function () { if (ui.reDone && ui.reDone.file && canInvoice()) folderIO.rechnungOeffnen(ui.reDone.file); },
    tick: function (d) {
      var it = findItem(client(), 'session', d.id); if (!it) return;
      it.tick = !it.tick;
      stamp(it); save(); render();
    },
    del: function (d, el) {
      var f = ui.form, c = client();
      if (f.type === 'client') { deleteClient(f.id); return; }
      if (!armed(el, 'Wirklich löschen')) return;
      else {
        var key = { session: 'sessions', mood: 'moods', task: 'tasks', topic: 'topics' }[f.type];
        c[key] = c[key].filter(function (x) { return x.id !== f.id; });
        /* Vermerk, dass dieser Eintrag absichtlich weg ist. Sonst
           holt ihn der Abgleich mit dem anderen Gerät wieder zurück. */
        if (!Array.isArray(c.deleted)) c.deleted = [];
        c.deleted.push({ id: f.id, at: new Date().toISOString() });
      }
      save(); closeForm(); toast('Gelöscht');
    },
    'example-remove': function () { S.clients = S.clients.filter(function (c) { return !c.example; }); save(); render(); },
    'export': function () { doExport(); },
    'import': function (d, el) { doImport(el); },
    copy: function () {
      var o = document.getElementById('bk-out'); if (!o) return;
      var fallback = function () { o.focus(); o.select(); bkMsg('Der Inhalt ist markiert und kann kopiert werden.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(o.value).then(function () { bkMsg('Inhalt kopiert.'); }, fallback);
      else fallback();
    },
    lock: function () { if (cryptoKey) showLock(); },
    'pin-set': function () { setPin(); },
    'pin-remove': function (d, el) { removePin(el); },
    forgot: function () { var f = document.getElementById('forgot'); if (f) f.hidden = false; },
    'forgot-wipe': function (d, el) {
      if (!armed(el, 'Wirklich alles löschen')) return;
      try { localStorage.removeItem(KEY); } catch (e) { /* nothing stored */ }
      cryptoKey = null; lockMeta = null; pendingLoad = false; S = normalize({ clients: [] }); save();
      ui = { view: 'home', clientId: null, tab: 'sessions', form: null, scrollY: 0, showDone: {} };
      hideLock(); go(); toast('Gerät geleert');
    },
    wipe: function (d, el) {
      if (!armed(el, 'Wirklich alle Einträge löschen')) return;
      S = normalize({ clients: [] }); save(); ui.view = 'home'; go(); toast('Gerät geleert');
    }
  };

  /* ---------- drag a file: right archives it, left deletes it ---------- */
  var sw = null, swipedAt = 0;
  function swLimit(li) { return Math.min(140, li.offsetWidth * 0.35); }
  function swEnd(commit) {
    var s = sw; sw = null;
    if (!s || !s.drag) return;
    swipedAt = Date.now();
    if (commit) { if (s.dir === 'left') deleteClient(s.li.dataset.id); else archiveClient(s.li.dataset.id); return; }
    s.btn.classList.add('back'); s.btn.style.transform = '';
    setTimeout(function () { s.btn.classList.remove('back'); s.li.classList.remove('drag', 'go', 'left', 'right'); }, 200);
  }
  document.addEventListener('pointerdown', function (e) {
    if (e.button || ui.form || isLocked) return;
    var btn = e.target.closest ? e.target.closest('.swipe > .client') : null;
    if (!btn) return;
    sw = { btn: btn, li: btn.parentNode, x: e.clientX, y: e.clientY, id: e.pointerId, drag: false, dx: 0 };
  });
  document.addEventListener('pointermove', function (e) {
    if (!sw || e.pointerId !== sw.id) return;
    var dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.drag) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
      if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      sw.drag = true; sw.dir = dx > 0 ? 'right' : 'left'; sw.li.classList.add('drag', sw.dir);
      try { sw.btn.setPointerCapture(sw.id); } catch (err) { /* capture is optional */ }
    }
    sw.dx = sw.dir === 'right' ? Math.max(0, dx) : Math.min(0, dx);
    sw.btn.style.transform = 'translateX(' + sw.dx + 'px)';
    sw.li.classList.toggle('go', Math.abs(sw.dx) >= swLimit(sw.li));
  });
  document.addEventListener('pointerup', function (e) { if (sw && e.pointerId === sw.id) swEnd(Math.abs(sw.dx) >= swLimit(sw.li)); });
  document.addEventListener('pointercancel', function (e) { if (sw && e.pointerId === sw.id) swEnd(false); });

  /* ------------------------------------------------------------------
     Einhängen
     Die Klicks hören nur im eigenen Behälter zu. Der Aktenschrank
     benutzt data-act für eigene Schaltflächen, unter anderem mit den
     gleichen Namen folge-done und folge-undo. Ohne diese Grenze würden
     sich beide gegenseitig auslösen.
     ------------------------------------------------------------------ */
  function wire(host) {
    host.addEventListener('click', function (e) {
      if (Date.now() - swipedAt < 400) return;
      var el = e.target.closest('[data-act]');
      if (!el || !host.contains(el) || !actions[el.dataset.act]) return;
      e.stopPropagation();
      if (el.dataset.act !== 'unarchive') ui.undo = null;
      if (el.dataset.act !== 'undelete') ui.undoDel = null;
      actions[el.dataset.act](el.dataset, el);
    });
    host.addEventListener('submit', function (e) {
      if (!host.contains(e.target)) return;
      e.preventDefault(); e.stopPropagation();
      if (e.target.id === 'lockform') doUnlock();
      else if (e.target.id === 'form' && ui.form && !isLocked) submitForm(e.target);
    });
  }
  function shell(host) {
    host.classList.add('sbapp');
    host.innerHTML = '<div id="sbApp"></div><div id="sbLock" hidden></div><div id="sbToast" class="toast" role="status" hidden></div>';
    root = host;
    app = host.querySelector('#sbApp');
    lockEl = host.querySelector('#sbLock');
    toastEl = host.querySelector('#sbToast');
    if (!host.dataset.sbWired) { wire(host); host.dataset.sbWired = '1'; }
  }
  var FRESH = function () { return { view: 'home', clientId: null, tab: 'sessions', form: null, scrollY: 0, showDone: {} }; };

  window.SBAPP = {
    /* Taschen-Ansicht: Handy und Tablet, alle Akten im Browserspeicher */
    tasche: function (host) {
      MODE = 'tasche'; folderIO = null;
      shell(host); host.classList.remove('inline');
      var data = load();
      isLocked = !data;
      pendingLoad = !data;
      S = data || normalize({ clients: [] });
      ui = FRESH();
      if (isLocked) showLock(); else render();
    },
    /* Ordner-Ansicht: der Aktenschrank zeigt eine Akte im Ordner Sitzungsbuch.
       record ist ihr Stand, io schreibt ihn zurück. */
    ordner: function (host, record, io, tab) {
      MODE = 'ordner'; folderIO = io; isLocked = false; cryptoKey = null;
      shell(host); host.classList.add('inline');
      var one = normalize({ clients: [record] });
      S = one;
      ui = FRESH();
      ui.view = 'client'; ui.clientId = one.clients[0].id;
      ui.tab = tab || 'sessions';
      render();
      return one.clients[0];
    },
    leer: function () { return normalize({ clients: [{ id: '', name: '' }] }).clients[0]; },
    pruefe: function (record) { return normalize({ clients: [record] }).clients[0]; },
    /* für den Aktenschrank: Zusammenführen, Kennzahlen, Erinnerung */
    merge: mergeClient,
    neuesZaehlen: mergeCount,
    kontingent: quotaStats,
    euro: euroIn,
    folge: folge,
    folgeText: folgeText,
    tab: function () { return ui.tab; },
    /* Der Aktenschrank hat den Stand von außen geändert (gelöschte Rechnung).
       Ein offenes Formular bleibt stehen; die Ansicht folgt beim Schließen. */
    auffrischen: function (msg) {
      if (!inFolder() || !app) return;
      if (!ui.form) render();
      if (msg) toast(msg);
    },
    lies: readBackup,
    einarbeiten: mergeInto,
    /* Sicherung aller Akten als PDF-Bytes, für den Rückweg zum Handy */
    sicherung: function (clients) { return makePdf(buildBackup(clients)); }
  };
})();

SBAPP.tasche(document.getElementById('sb'));
</script>
